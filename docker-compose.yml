services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # for live code updates
    environment:
      - DEBUG=1
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # named vol = init from image
    depends_on:
      - backend
    command: pnpm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules: